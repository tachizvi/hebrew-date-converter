<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hebrew Date Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <main class="card converter">
        <header>
          <h1>Hebrew Date Converter</h1>
          <p class="subtitle">Convert between the Gregorian and the Hebrew calendar.</p>
        </header>

        <div class="tabs" role="tablist" aria-label="Conversion direction">
          <button
            id="tab-g2h"
            class="tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="convert-form"
          >
            Gregorian → Hebrew
          </button>
          <button
            id="tab-h2g"
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="hebrew-form"
          >
            Hebrew → Gregorian
          </button>
        </div>

        <form id="convert-form" role="tabpanel" aria-labelledby="tab-g2h" novalidate>
          <div class="field">
            <label for="date">Gregorian date</label>
            <input id="date" name="date" type="date" required />
          </div>

          <label class="checkbox">
            <input id="afterSunset" name="afterSunset" type="checkbox" />
            After sunset <span class="hint">(the Hebrew day starts at nightfall)</span>
          </label>

          <button id="submit" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Convert</span>
          </button>
        </form>

        <form id="hebrew-form" role="tabpanel" aria-labelledby="tab-h2g" novalidate hidden>
          <div class="hebrew-fields">
            <div class="field">
              <label for="h-day">Day</label>
              <select id="h-day" name="day"></select>
            </div>
            <div class="field">
              <label for="h-month">Month</label>
              <select id="h-month" name="month"></select>
            </div>
            <div class="field">
              <label for="h-year">Year</label>
              <input id="h-year" name="year" type="number" min="3762" max="9999" required />
            </div>
          </div>
          <p id="h-leap" class="hint"></p>

          <button id="h-submit" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Convert</span>
          </button>
        </form>

        <section id="result" class="result" aria-live="polite" hidden>
          <p id="primary" class="primary"></p>
          <p id="secondary" class="secondary"></p>
          <div class="events-block">
            <h2>Events</h2>
            <ul id="events" class="events"></ul>
          </div>
          <p id="meta" class="meta"></p>
        </section>

        <p id="error" class="error" role="alert" hidden></p>
      </main>

      <section class="card calendar-card" aria-labelledby="cal-title">
        <div class="cal-header">
          <button id="cal-prev" class="icon-button" type="button" aria-label="Previous month">
            ‹
          </button>
          <div class="cal-titles">
            <h2 id="cal-title">&nbsp;</h2>
            <p id="cal-hebrew-months" class="cal-hebrew-months" dir="rtl" lang="he">&nbsp;</p>
          </div>
          <button id="cal-next" class="icon-button" type="button" aria-label="Next month">›</button>
        </div>

        <div class="cal-weekdays" aria-hidden="true">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span
          ><span>Fri</span><span>Sat</span>
        </div>
        <div id="cal-grid" class="cal-grid" role="grid" aria-busy="true"></div>
        <p id="cal-error" class="error" role="alert" hidden></p>
        <p id="cal-meta" class="meta"></p>
      </section>

      <footer>
        Data from the
        <a
          href="https://www.hebcal.com/home/219/hebrew-date-converter-rest-api"
          target="_blank"
          rel="noopener"
          >Hebcal REST API</a
        >
        via this service's <code>/api/convert</code>, <code>/api/convert-hebrew</code> and
        <code>/api/calendar</code>.
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
